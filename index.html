<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MuziDynamic Detector</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eeeaff, #dcf7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #29294a;
    }

    .app {
      width: 90%;
      max-width: 800px;
      background: white;
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin: 0;
    }

    .tagline {
      margin-top: 8px;
      font-size: 20px;
      color: #777;
    }

    button {
      margin-top: 30px;
      background: #7357e8;
      color: white;
      border: none;
      padding: 18px 30px;
      border-radius: 18px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
    }

    .meter-area {
      margin-top: 35px;
    }

    .meter-background {
      width: 100%;
      height: 48px;
      background: #eeeeee;
      border-radius: 30px;
      overflow: hidden;
    }

    #meter {
      height: 100%;
      width: 0%;
      background: linear-gradient(
        90deg,
        #74b9ff 0%,
        #55efc4 35%,
        #ffe66d 65%,
        #ff7675 100%
      );
      border-radius: 30px;
      transition: width 0.12s ease-out;
    }

    #dbValue {
      font-size: 42px;
      font-weight: bold;
      margin-top: 18px;
    }

    #signalStatus {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 18px;
      border-radius: 15px;
      background: #eeeeee;
      font-size: 17px;
      font-weight: bold;
    }

    .technical {
      margin-top: 25px;
      padding: 15px;
      background: #f7f7fb;
      border-radius: 15px;
      font-size: 14px;
      color: #666;
    }

    .note {
      margin-top: 25px;
      font-size: 13px;
      color: #888;
    }

  </style>
</head>

<body>

  <div class="app">

    <h1>🎵 MuziDynamic Detector</h1>

    <div class="tagline">
      Dengar • Nyanyi • Ukur • Kuasai
    </div>

    <button id="startButton">
      🎤 Aktifkan Mikrofon
    </button>

    <div id="status">
      Mikrofon belum diaktifkan.
    </div>

    <div class="meter-area">

      <div class="meter-background">
        <div id="meter"></div>
      </div>

      <div id="dbValue">
        -- dB
      </div>

      <div id="signalStatus">
        Menunggu input
      </div>

    </div>

    <div class="technical">
      RMS:
      <span id="rmsValue">--</span>

      &nbsp; • &nbsp;

      Peak:
      <span id="peakValue">--</span>
    </div>

    <div class="note">
      Bacaan dB ialah aras signal relatif mikrofon,
      bukan ukuran dB SPL mutlak.
    </div>

  </div>


<script>

const startButton =
  document.getElementById("startButton");

const statusText =
  document.getElementById("status");

const meter =
  document.getElementById("meter");

const dbValue =
  document.getElementById("dbValue");

const signalStatus =
  document.getElementById("signalStatus");

const rmsValue =
  document.getElementById("rmsValue");

const peakValue =
  document.getElementById("peakValue");


let audioContext;
let analyser;
let dataArray;

let smoothedDb = -80;


/* =========================
   AKTIFKAN MIKROFON
========================= */

startButton.addEventListener(
  "click",
  startMicrophone
);


async function startMicrophone() {

  try {

    statusText.textContent =
      "Meminta kebenaran mikrofon...";


    const stream =
      await navigator.mediaDevices.getUserMedia({

        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }

      });


    audioContext =
      new (window.AudioContext ||
           window.webkitAudioContext)();


    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }


    const source =
      audioContext.createMediaStreamSource(stream);


    analyser =
      audioContext.createAnalyser();


    analyser.fftSize = 2048;


    source.connect(analyser);


    dataArray =
      new Float32Array(analyser.fftSize);


    statusText.textContent =
      "✅ Mikrofon aktif";

    startButton.style.display =
      "none";


    updateAudio();

  }

  catch (error) {

    console.error(error);

    statusText.textContent =
      "❌ Mikrofon tidak dapat diakses.";

  }

}


/* =========================
   ANALISIS AUDIO
========================= */

function updateAudio() {

  analyser.getFloatTimeDomainData(
    dataArray
  );


  let sumSquares = 0;
  let peak = 0;


  for (
    let i = 0;
    i < dataArray.length;
    i++
  ) {

    const sample =
      dataArray[i];


    sumSquares +=
      sample * sample;


    const absolute =
      Math.abs(sample);


    if (absolute > peak) {
      peak = absolute;
    }

  }


  /* RMS */

  const rms =
    Math.sqrt(
      sumSquares /
      dataArray.length
    );


  /* RMS → relative dB */

  let currentDb;

  if (rms > 0.00001) {

    currentDb =
      20 * Math.log10(rms);

  } else {

    currentDb = -100;

  }


  /* Hadkan bacaan */

  currentDb =
    Math.max(-80,
      Math.min(0, currentDb)
    );


  /* Smoothing */

  smoothedDb =
    (smoothedDb * 0.82) +
    (currentDb * 0.18);


  /* Tukar -80...0 kepada 0...100 */

  let meterPercent =
    ((smoothedDb + 80) / 80)
    * 100;


  meterPercent =
    Math.max(
      0,
      Math.min(100, meterPercent)
    );


  meter.style.width =
    meterPercent + "%";


  dbValue.textContent =
    smoothedDb.toFixed(1)
    + " dB";


  rmsValue.textContent =
    rms.toFixed(4);


  peakValue.textContent =
    peak.toFixed(3);


  /* =====================
     STATUS SIGNAL
  ===================== */


  if (smoothedDb < -55) {

    signalStatus.textContent =
      "🤫 Senyap / Input sangat lemah";

    signalStatus.style.background =
      "#eeeeee";

  }


  else if (peak > 0.95) {

    signalStatus.textContent =
      "⚠️ Input terlalu kuat / Clipping";

    signalStatus.style.background =
      "#ffd6d6";

  }


  else {

    signalStatus.textContent =
      "🎵 Input baik";

    signalStatus.style.background =
      "#dff8e8";

  }


  requestAnimationFrame(
    updateAudio
  );

}

</script>

</body>
</html>
