<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MuziDynamic Detector</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e9e7ff, #dff7ff);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #2d2d4d;
    }

    .app {
      width: 90%;
      max-width: 700px;
      background: white;
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    .tagline {
      font-size: 20px;
      color: #777;
      margin-bottom: 35px;
    }

    button {
      background: #7357e8;
      color: white;
      border: none;
      padding: 18px 30px;
      border-radius: 18px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
    }

    .meter-container {
      margin-top: 35px;
    }

    .meter-background {
      width: 100%;
      height: 45px;
      background: #eeeeee;
      border-radius: 25px;
      overflow: hidden;
    }

    #meter {
      width: 0%;
      height: 100%;
      background: linear-gradient(
        90deg,
        #74b9ff,
        #55efc4,
        #ffe66d,
        #ff7675
      );
      transition: width 0.08s linear;
    }

    #level {
      font-size: 32px;
      font-weight: bold;
      margin-top: 15px;
    }

    .note {
      margin-top: 30px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🎵 MuziDynamic Detector</h1>

    <div class="tagline">
      Dengar • Nyanyi • Ukur • Kuasai
    </div>

    <button id="startButton">
      🎤 Aktifkan Mikrofon
    </button>

    <div id="status">
      Mikrofon belum diaktifkan.
    </div>

    <div class="meter-container">

      <div class="meter-background">
        <div id="meter"></div>
      </div>

      <div id="level">
        --
      </div>

    </div>

    <div class="note">
      Ujian mikrofon MuziDynamic • Prototype 1
    </div>

  </div>


<script>

const startButton = document.getElementById("startButton");
const statusText = document.getElementById("status");
const meter = document.getElementById("meter");
const levelText = document.getElementById("level");

let audioContext;
let analyser;
let dataArray;


startButton.addEventListener("click", startMicrophone);


async function startMicrophone() {

  try {

    statusText.textContent = "Meminta kebenaran mikrofon...";

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    await audioContext.resume();

    const source =
      audioContext.createMediaStreamSource(stream);

    analyser = audioContext.createAnalyser();

    analyser.fftSize = 2048;

    source.connect(analyser);

    dataArray =
      new Float32Array(analyser.fftSize);

    statusText.textContent =
      "✅ Mikrofon aktif! Cuba bercakap atau menyanyi.";

    startButton.style.display = "none";

    updateMeter();

  }

  catch (error) {

    console.error(error);

    statusText.textContent =
      "❌ Mikrofon tidak dapat diakses. Sila benarkan akses mikrofon.";

  }

}


function updateMeter() {

  analyser.getFloatTimeDomainData(dataArray);

  let sumSquares = 0;

  for (let i = 0; i < dataArray.length; i++) {

    sumSquares +=
      dataArray[i] * dataArray[i];

  }

  const rms =
    Math.sqrt(sumSquares / dataArray.length);

  let percentage =
    Math.min(100, rms * 400);

  meter.style.width =
    percentage + "%";

  levelText.textContent =
    "Input: " + Math.round(percentage) + "%";

  requestAnimationFrame(updateMeter);

}

</script>

</body>
</html>
